[project]
name = "fly-in"
version = "0.1.0"
description = "Efficient multi-drone routing through a network of zones."
readme = "README.md"
requires-python = ">3.12"
dependencies = [
    "pydantic>=2.13.5"
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]